apply plugin: 'com.android.application'
apply from: 'audio-release-guard.gradle'

android {
    namespace = 'com.fr3ts0n.ecu.gui.androbd'
    compileSdk 37

    buildFeatures {
        resValues = true
        buildConfig = true
    }

    // Exercise bundled JSON through the same public org.json API on the JVM.
    sourceSets {
        test.resources.srcDir 'src/main/assets'
    }

    androidResources {
        // Memory-map the bundled offline model; no second decompressed model allocation.
        noCompress += ['tflite']
    }

    defaultConfig {
        minSdk 23
        targetSdkVersion 37
        versionCode 30002
        versionName 'V3.0.2'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        resValue "string", "app_version", versionName

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }

    lint {
        // Existing findings (278 issues, 187 of them Error severity as of
        // 2026-07-24) are grandfathered into this baseline rather than fixed
        // individually -- fixing them is real, separate effort. New lint
        // issues not in the baseline still fail the build.
        disable 'MissingTranslation'
        disable 'BidiSpoofing'
        baseline = file("lint-baseline.xml")
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation project(':plugin')
    implementation project(':library')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.github.mik3y:usb-serial-for-android:3.9.0'
    implementation 'com.github.anastr:speedviewlib:1.6.1'
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // Maintained Interpreter line, minSdk 21; no Google Play Services runtime dependency.
    implementation 'com.google.ai.edge.litert:litert:1.4.2'

    // Local (JVM) unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'

    // Android instrumented tests
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
}
