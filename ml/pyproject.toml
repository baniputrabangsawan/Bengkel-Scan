[project]
name = "bengkel-audio-training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.5",
  "scipy==1.18.1",
  "librosa==1.0.1",
  "soundfile==0.14.0",
  "tensorflow-cpu==2.21.0",
  "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
